<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6edf3;
    --surface: #f3f8fb;
    --surface-raised: #fcfeff;
    --ink: #1b2e3d;
    --ink-soft: #4d6577;
    --ink-faint: #8098a8;
    --line: #c2d3de;
    --line-soft: #d6e2ea;
    --accent: #1f6f6b;
    --accent-ink: #fcfeff;
    --accent-soft: #dceae7;
    --accent-soft-line: #b9d6d2;
    --danger: #9b3b2c;
    --danger-soft: #f1e2de;
    --shadow: 0 1px 2px rgba(20, 35, 48, 0.07), 0 4px 14px rgba(20, 35, 48, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a24; --surface: #16232f; --surface-raised: #1c2c3a;
      --ink: #e2edf4; --ink-soft: #a9bfcf; --ink-faint: #708494;
      --line: #2b3f4d; --line-soft: #223543;
      --accent: #4fbbb3; --accent-ink: #0c1b1a; --accent-soft: #1f3a37; --accent-soft-line: #2f5551;
      --danger: #e28468; --danger-soft: #392722;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a24; --surface: #16232f; --surface-raised: #1c2c3a;
    --ink: #e2edf4; --ink-soft: #a9bfcf; --ink-faint: #708494;
    --line: #2b3f4d; --line-soft: #223543;
    --accent: #4fbbb3; --accent-ink: #0c1b1a; --accent-soft: #1f3a37; --accent-soft-line: #2f5551;
    --danger: #e28468; --danger-soft: #392722;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Catamaran", system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 640px; margin: 0 auto; padding: 0 1.1rem 5rem; }

  /* ---------- header ---------- */
  header.top { padding: 1.4rem 0 0.9rem; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .header-row h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0; letter-spacing: 0.01em;
  }
  .iconbtn {
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink-soft);
    width: 2.1rem; height: 2.1rem; border-radius: 9px; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .iconbtn:hover { color: var(--ink); }
  .sync-pill {
    margin-top: 0.5rem; border: 0; background: none; padding: 0; cursor: pointer;
    font: inherit; font-size: 0.78rem; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .sync-pill::before {
    content: ""; width: 0.5rem; height: 0.5rem; border-radius: 999px;
    background: currentColor; flex-shrink: 0;
  }
  .sync-pill.ok { color: var(--accent); }
  .sync-pill.err { color: var(--danger); text-decoration: underline; }

  /* ---------- add form ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.1rem; box-shadow: var(--shadow);
    margin-bottom: 1.4rem;
  }
  .row { display: flex; gap: 0.6rem; }
  .row > * { min-width: 0; }
  .field { margin-bottom: 0.7rem; position: relative; }
  .field:last-child { margin-bottom: 0; }
  label.lbl {
    display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 0.28rem;
  }
  .time-in { font-family: "JetBrains Mono", monospace; letter-spacing: 0.05em; }
  input[type="text"], input[type="time"], input[type="date"], textarea {
    width: 100%; font: inherit; font-size: 0.95rem;
    background: var(--surface-raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 0.55rem 0.65rem;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .time-wrap { display: flex; gap: 0.4rem; }
  .time-wrap input { flex: 1; }
  .btn {
    font: inherit; font-weight: 700; border-radius: 9px; padding: 0.55rem 0.9rem;
    cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: var(--surface-raised); color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); }
  .btn-small { padding: 0.4rem 0.7rem; font-size: 0.82rem; font-weight: 600; }
  .form-actions { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .form-actions .btn-primary { flex: 1; }

  /* category autocomplete */
  .ac-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 3px); z-index: 8;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: var(--shadow); overflow: hidden; max-height: 220px; overflow-y: auto;
  }
  .ac-list[hidden] { display: none; }
  .ac-item {
    padding: 0.5rem 0.65rem; font-size: 0.9rem; cursor: pointer;
    display: flex; justify-content: space-between; gap: 0.5rem;
  }
  .ac-item:hover, .ac-item.active { background: var(--accent-soft); color: var(--accent); }
  .ac-item .cnt { color: var(--ink-faint); font-size: 0.78rem; }

  /* ---------- day navigation ---------- */
  .daynav { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; }
  .daynav .date-label { font-weight: 700; font-size: 1rem; flex: 1; }
  .daynav .date-label .rel { color: var(--ink-faint); font-weight: 500; font-size: 0.85rem; margin-left: 0.35rem; }
  .daynav input[type="date"] { width: auto; padding: 0.3rem 0.4rem; font-size: 0.8rem; }

  /* ---------- day summary ---------- */
  .summary { margin-bottom: 1rem; }
  .summary-total { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.5rem; }
  .summary-total b { color: var(--ink); font-size: 1.05rem; }
  .cat-bar { display: flex; height: 0.5rem; border-radius: 999px; overflow: hidden; background: var(--line-soft); }
  .cat-bar span { display: block; height: 100%; }
  .cat-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; margin-top: 0.5rem; }
  .cat-legend .lg { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--ink-soft); }
  .cat-legend .dot { width: 0.6rem; height: 0.6rem; border-radius: 3px; flex-shrink: 0; }

  /* ---------- timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .entry {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.7rem 0.8rem; margin-bottom: 0.55rem; box-shadow: var(--shadow);
  }
  .entry-head { display: flex; align-items: baseline; gap: 0.6rem; cursor: pointer; }
  .entry-time { font-family: "JetBrains Mono", monospace; font-size: 0.82rem; color: var(--ink-soft); flex-shrink: 0; }
  .entry-dur {
    font-family: "JetBrains Mono", monospace; font-size: 0.75rem; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border-radius: 999px;
    padding: 0.1rem 0.45rem; flex-shrink: 0;
  }
  .entry-dur.ongoing { color: var(--accent-ink); background: var(--accent); }
  .entry-dur.manual { box-shadow: inset 0 0 0 1px var(--accent-soft-line); }
  .entry-main { flex: 1; min-width: 0; }
  .entry-narration { font-size: 0.95rem; line-height: 1.35; word-wrap: break-word; }
  .entry-category {
    display: inline-block; margin-top: 0.2rem; font-size: 0.72rem; font-weight: 700;
    color: var(--ink-soft); background: var(--line-soft); border-radius: 999px; padding: 0.12rem 0.5rem;
  }
  .entry-edit { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--line-soft); }
  .entry-edit[hidden] { display: none; }
  .entry-edit .form-actions { margin-top: 0.7rem; }
  .entry-edit .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  .stopmark {
    display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0 0.7rem;
    font-family: "JetBrains Mono", monospace; font-size: 0.75rem; color: var(--ink-faint);
  }
  .stopmark::before, .stopmark::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .stopmark button { border: 0; background: none; color: var(--danger); cursor: pointer; font: inherit; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 0.9rem; padding: 2rem 1rem; }

  /* ---------- modal ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10, 17, 24, 0.5);
    z-index: 20; align-items: flex-start; justify-content: center; padding: 5vh 1rem; overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    max-width: 520px; width: 100%; padding: 1.3rem; box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 1.15rem; margin: 0 0 0.3rem; }
  .modal p.note { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 1rem; line-height: 1.5; }
  .modal textarea { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; min-height: 7rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; }
  .status-line { font-size: 0.83rem; margin-top: 0.5rem; min-height: 1.1em; font-weight: 600; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="header-row">
      <h1>Time Tracker</h1>
      <button class="iconbtn" id="backupBtn" title="Backup / restore" aria-label="Backup or restore">⇅</button>
    </div>
    <button class="sync-pill" id="syncPill" type="button">Checking sync…</button>
  </header>

  <!-- ADD -->
  <div class="panel">
    <form id="addForm" autocomplete="off">
      <div class="field">
        <label class="lbl" for="f-time">Start time</label>
        <div class="time-wrap">
          <input type="text" id="f-time" class="time-in" inputmode="numeric" autocomplete="off"
                 maxlength="5" placeholder="0930" aria-label="Start time, 24-hour, type four digits" required>
          <button type="button" class="btn btn-ghost btn-small" id="nowBtn">Now</button>
          <button type="button" class="btn btn-ghost btn-small" id="agoBtn" title="Tap to step back a minute at a time">1 min ago</button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="f-narration">What are you doing?</label>
        <input type="text" id="f-narration" placeholder="e.g. Reviewed pull requests" required>
      </div>
      <div class="field">
        <label class="lbl" for="f-category">Category</label>
        <input type="text" id="f-category" placeholder="e.g. Work" role="combobox" aria-autocomplete="list" aria-expanded="false">
        <div class="ac-list" id="categoryAc" hidden></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Log entry</button>
        <button type="button" class="btn btn-ghost" id="stopBtn" title="Mark the end of the current task">Stop</button>
      </div>
    </form>
  </div>

  <!-- DAY -->
  <div class="daynav">
    <button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
    <span class="date-label" id="dateLabel"></span>
    <input type="date" id="datePicker">
    <button class="iconbtn" id="nextDay" aria-label="Next day">›</button>
  </div>

  <div class="summary" id="summary" hidden></div>
  <ul class="timeline" id="timeline"></ul>
</div>

<!-- sync modal -->
<div class="modal-backdrop" id="syncModal">
  <div class="modal">
    <h2>Sync across devices</h2>
    <p class="note">Your entries are stored in a private Gist on your GitHub account. Create a personal access token scoped only to “gist” (it can’t touch your repos), then paste it below — once per device.</p>
    <p><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Time%20Tracker%20sync" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Create a gist-only token on GitHub →</a></p>
    <div class="field">
      <label class="lbl" for="syncTokenInput">Sync key</label>
      <input type="password" id="syncTokenInput" placeholder="ghp_…" autocomplete="off">
    </div>
    <div class="status-line" id="syncTokenStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-small" id="removeSyncKey">Remove key</button>
      <button class="btn btn-ghost btn-small" id="closeSyncModal">Close</button>
      <button class="btn btn-primary btn-small" id="saveSyncKey">Save</button>
    </div>
  </div>
</div>

<!-- backup modal -->
<div class="modal-backdrop" id="backupModal">
  <div class="modal">
    <h2>Backup / restore</h2>
    <p class="note" id="backupNote"></p>
    <textarea id="backupText" spellcheck="false"></textarea>
    <div class="status-line" id="backupStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-small" id="closeBackup">Close</button>
      <button class="btn btn-ghost btn-small" id="copyBackup">Copy</button>
      <button class="btn btn-primary btn-small" id="restoreBackup">Restore from text</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "time-tracker-data";
  var TOKEN_KEY = "time-tracker-gh-token";
  var GIST_ID_KEY = "time-tracker-gist-id";
  var GITHUB_API = "https://api.github.com";
  var GIST_FILENAME = "time-tracker.json";

  var state = { entries: [], categories: [] };
  var pendingSync = false;
  var flushTimer = null;
  var syncMode = "init";
  var viewDate = todayKey();

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayKey() { return dateKey(new Date()); }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function keyToDate(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  function nowHHMM() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function hhmmMinsAgo(mins) { var d = new Date(Date.now() - mins * 60000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  // "0930" / "930" / "9:30" -> "09:30"; last two digits are minutes, the rest is the hour.
  // returns "" if the digits don't make a valid 24-hour time.
  function normTime(raw) {
    var s = String(raw == null ? "" : raw).replace(/\D/g, "");
    if (!s) return "";
    var h, m;
    if (s.length <= 2) { h = +s; m = 0; }
    else { h = +s.slice(0, -2); m = +s.slice(-2); }
    if (h > 23 || m > 59) return "";
    return pad(h) + ":" + pad(m);
  }
  // live: drop non-digits, cap at 4, and slot a colon before the last two
  function liveTimeFormat(raw) {
    var s = String(raw == null ? "" : raw).replace(/\D/g, "").slice(0, 4);
    return s.length >= 3 ? s.slice(0, -2) + ":" + s.slice(-2) : s;
  }
  function attachTimeInput(el) {
    el.addEventListener("input", function () {
      var start = el.selectionStart, before = el.value;
      el.value = liveTimeFormat(el.value);
      if (start === before.length) el.setSelectionRange(el.value.length, el.value.length);
    });
    el.addEventListener("blur", function () {
      var t = normTime(el.value);
      if (t) el.value = t;
    });
  }

  // combine a day key (YYYY-MM-DD) + HH:MM into a local ISO timestamp
  function makeStartAt(dayK, hhmm) {
    var dp = dayK.split("-"), tp = hhmm.split(":");
    var d = new Date(+dp[0], +dp[1] - 1, +dp[2], +tp[0], +tp[1], 0, 0);
    return d.toISOString();
  }
  function fmtClock(iso) { var d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDuration(ms) {
    if (ms < 0) ms = 0;
    var mins = Math.round(ms / 60000);
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function relLabel(k) {
    var diff = Math.round((keyToDate(k) - keyToDate(todayKey())) / 86400000);
    if (diff === 0) return "today";
    if (diff === -1) return "yesterday";
    if (diff === 1) return "tomorrow";
    return null;
  }

  var CAT_COLORS = ["#1f6f6b", "#c98a2b", "#6a5acd", "#b5546a", "#3f7fbf", "#4f9d5d", "#9b6b3b", "#7d7d90"];
  function catColor(name) {
    var list = state.categories.length ? state.categories : [];
    var i = list.indexOf(name);
    if (i < 0) i = Math.abs(hashStr(name)) % CAT_COLORS.length;
    return CAT_COLORS[i % CAT_COLORS.length];
  }
  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i) | 0; return h; }

  // ---------- state ----------
  function emptyState() { return { entries: [], categories: [] }; }

  function normalizeState(raw) {
    raw = (raw && typeof raw === "object") ? raw : {};
    var entries = (Array.isArray(raw.entries) ? raw.entries : []).map(function (e) {
      // `type` is the old field name, kept here so existing data still loads
      var cat = typeof e.category === "string" ? e.category : (typeof e.type === "string" ? e.type : "");
      return {
        id: e.id || uid(),
        startAt: e.startAt || (e.date && e.start ? makeStartAt(e.date, e.start) : new Date().toISOString()),
        // optional manual end; when empty the end is the next entry's start
        endAt: e.endAt && !isNaN(new Date(e.endAt)) ? new Date(e.endAt).toISOString() : "",
        narration: typeof e.narration === "string" ? e.narration : "",
        category: cat,
        stop: !!e.stop,
        createdAt: e.createdAt || new Date().toISOString()
      };
    }).filter(function (e) { return !isNaN(new Date(e.startAt)); });
    entries.sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });

    var catSet = {};
    var rawCats = Array.isArray(raw.categories) ? raw.categories : (Array.isArray(raw.types) ? raw.types : []);
    rawCats.forEach(function (t) { if (t) catSet[t] = true; });
    entries.forEach(function (e) { if (e.category) catSet[e.category] = true; });
    return { entries: entries, categories: Object.keys(catSet).sort() };
  }

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? normalizeState(JSON.parse(raw)) : emptyState();
    } catch (e) { return emptyState(); }
  }
  function cacheLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- github gist sync ----------
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function getCachedGistId() { try { return localStorage.getItem(GIST_ID_KEY) || ""; } catch (e) { return ""; } }
  function setCachedGistId(id) { try { if (id) localStorage.setItem(GIST_ID_KEY, id); else localStorage.removeItem(GIST_ID_KEY); } catch (e) {} }
  function ghHeaders() { return { "Authorization": "token " + getToken(), "Accept": "application/vnd.github+json" }; }

  function setSyncStatus(mode) {
    syncMode = mode;
    var pill = document.getElementById("syncPill");
    pill.classList.remove("ok", "err");
    if (mode === "synced") { pill.textContent = "Synced across your devices"; pill.classList.add("ok"); }
    else if (mode === "syncing") { pill.textContent = "Saving…"; pill.classList.add("ok"); }
    else if (mode === "local") { pill.textContent = "Local only — tap to set up sync"; pill.classList.add("err"); }
    else if (mode === "badtoken") { pill.textContent = "Sync key not working — tap to fix"; pill.classList.add("err"); }
    else if (mode === "error") { pill.textContent = "Not synced — tap to retry"; pill.classList.add("err"); }
    else { pill.textContent = "Checking sync…"; }
  }

  function findOrCreateGist() {
    var cached = getCachedGistId();
    if (cached) {
      return fetch(GITHUB_API + "/gists/" + cached, { headers: ghHeaders() }).then(function (res) {
        if (res.status === 401) return Promise.reject({ code: "bad_token" });
        if (res.ok) return cached;
        return searchOrCreateGist();
      });
    }
    return searchOrCreateGist();
  }
  function searchOrCreateGist() {
    return fetch(GITHUB_API + "/gists?per_page=100", { headers: ghHeaders() }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      return res.json();
    }).then(function (list) {
      var found = list.find(function (g) { return g.files && g.files[GIST_FILENAME]; });
      if (found) { setCachedGistId(found.id); return found.id; }
      var body = { description: "Time Tracker data", public: false, files: {} };
      body.files[GIST_FILENAME] = { content: JSON.stringify(emptyState()) };
      return fetch(GITHUB_API + "/gists", { method: "POST", headers: ghHeaders(), body: JSON.stringify(body) })
        .then(function (res) {
          if (res.status === 401) return Promise.reject({ code: "bad_token" });
          if (!res.ok) return Promise.reject({ code: "http_error" });
          return res.json();
        })
        .then(function (g) { setCachedGistId(g.id); return g.id; });
    });
  }

  function queueMutation(mutateFn) {
    state = mutateFn(state);
    state = normalizeState(state);
    cacheLocal();
    render();
    if (!getToken()) return;
    pendingSync = true;
    setSyncStatus("syncing");
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushToRemote, 800);
  }

  function flushToRemote() {
    if (!getToken() || !pendingSync) return;
    pendingSync = false;
    findOrCreateGist().then(function (gistId) {
      var body = { files: {} };
      body.files[GIST_FILENAME] = { content: JSON.stringify(state) };
      return fetch(GITHUB_API + "/gists/" + gistId, { method: "PATCH", headers: ghHeaders(), body: JSON.stringify(body) });
    }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      setSyncStatus("synced");
    }).catch(function (err) {
      pendingSync = true;
      setSyncStatus(err && err.code === "bad_token" ? "badtoken" : "error");
    });
  }

  function initSync() {
    state = loadLocalCache();
    render();
    if (!getToken()) { setSyncStatus("local"); return Promise.resolve(); }
    setSyncStatus("syncing");
    return findOrCreateGist().then(function (gistId) {
      return fetch(GITHUB_API + "/gists/" + gistId, { headers: ghHeaders() });
    }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      return res.json();
    }).then(function (gist) {
      var file = gist.files && gist.files[GIST_FILENAME];
      var remote = file && file.content ? JSON.parse(file.content) : null;
      state = normalizeState(remote);
      cacheLocal();
      render();
      setSyncStatus("synced");
    }).catch(function (err) {
      setSyncStatus(err && err.code === "bad_token" ? "badtoken" : "error");
    });
  }

  // ---------- derived: entries with end times ----------
  function rowsForDay(dayK) {
    var all = state.entries.slice().sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
    var rows = [];
    for (var i = 0; i < all.length; i++) {
      var e = all[i];
      if (dateKey(new Date(e.startAt)) !== dayK) continue;
      var next = all[i + 1];
      var autoEndAt = next ? next.startAt : null;
      // a manual end time on the entry wins over the next entry's start
      var endAt = e.endAt || autoEndAt;
      rows.push({ entry: e, endAt: endAt, autoEndAt: autoEndAt, hasManualEnd: !!e.endAt, isLast: !next });
    }
    return rows;
  }

  // ---------- render ----------
  function render() {
    renderDayNav();
    renderSummary();
    renderTimeline();
  }

  function renderDayNav() {
    var rel = relLabel(viewDate);
    var d = keyToDate(viewDate);
    var nice = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    document.getElementById("dateLabel").innerHTML =
      escapeHtml(nice) + (rel ? ' <span class="rel">' + escapeHtml(rel) + "</span>" : "");
    document.getElementById("datePicker").value = viewDate;
    document.getElementById("nextDay").disabled = false;
  }

  function renderSummary() {
    var box = document.getElementById("summary");
    var rows = rowsForDay(viewDate).filter(function (r) { return !r.entry.stop; });
    if (!rows.length) { box.hidden = true; box.innerHTML = ""; return; }
    var now = Date.now();
    var byCat = {};
    var total = 0;
    rows.forEach(function (r) {
      var start = new Date(r.entry.startAt).getTime();
      var end = r.endAt ? new Date(r.endAt).getTime() : (r.isLast && viewDate === todayKey() ? now : null);
      if (end == null) return;
      var dur = Math.max(0, end - start);
      total += dur;
      var c = r.entry.category || "—";
      byCat[c] = (byCat[c] || 0) + dur;
    });
    var cats = Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; });
    var bar = cats.map(function (c) {
      var pct = total ? (byCat[c] / total * 100) : 0;
      return '<span style="width:' + pct.toFixed(2) + '%;background:' + catColor(c) + '"></span>';
    }).join("");
    var legend = cats.map(function (c) {
      return '<span class="lg"><span class="dot" style="background:' + catColor(c) + '"></span>' +
        escapeHtml(c) + " · " + fmtDuration(byCat[c]) + "</span>";
    }).join("");
    box.hidden = false;
    box.innerHTML =
      '<div class="summary-total">Tracked <b>' + fmtDuration(total) + "</b> across " + rows.length +
      " " + (rows.length === 1 ? "entry" : "entries") + "</div>" +
      (total ? '<div class="cat-bar">' + bar + "</div>" : "") +
      '<div class="cat-legend">' + legend + "</div>";
  }

  function renderTimeline() {
    var ul = document.getElementById("timeline");
    var rows = rowsForDay(viewDate);
    if (!rows.length) {
      ul.innerHTML = '<li class="empty">Nothing logged for this day yet.</li>';
      return;
    }
    var now = Date.now();
    ul.innerHTML = rows.map(function (r) {
      var e = r.entry;
      if (e.stop) {
        return '<li class="stopmark" data-id="' + e.id + '">ended ' + fmtClock(e.startAt) +
          ' · <button type="button" data-act="del-stop">remove</button></li>';
      }
      var startMs = new Date(e.startAt).getTime();
      var endMs = r.endAt ? new Date(r.endAt).getTime() : null;
      var ongoing = false, durHtml = "";
      if (endMs != null) {
        durHtml = '<span class="entry-dur' + (r.hasManualEnd ? ' manual" title="end time set manually' : '') +
          '">' + fmtDuration(endMs - startMs) + "</span>";
      } else if (r.isLast && viewDate === todayKey()) {
        ongoing = true;
        durHtml = '<span class="entry-dur ongoing">' + fmtDuration(now - startMs) + " · now</span>";
      }
      var timeRange = fmtClock(e.startAt) + (endMs != null ? "–" + fmtClock(r.endAt) : ongoing ? "–now" : "");
      return '<li class="entry" data-id="' + e.id + '">' +
        '<div class="entry-head">' +
          '<span class="entry-time">' + timeRange + "</span>" +
          '<span class="entry-main">' +
            '<span class="entry-narration">' + escapeHtml(e.narration || "(no note)") + "</span><br>" +
            (e.category ? '<span class="entry-category">' + escapeHtml(e.category) + "</span>" : "") +
          "</span>" +
          durHtml +
        "</div>" +
        '<div class="entry-edit" hidden>' +
          '<div class="row">' +
            '<div class="field" style="flex:1"><label class="lbl">Start time</label><input type="text" class="time-in" inputmode="numeric" maxlength="5" data-f="time" value="' + fmtClock(e.startAt) + '"></div>' +
            '<div class="field" style="flex:1"><label class="lbl">End time</label><input type="text" class="time-in" inputmode="numeric" maxlength="5" data-f="end" value="' + (e.endAt ? fmtClock(e.endAt) : "") + '" placeholder="' + (r.autoEndAt ? fmtClock(r.autoEndAt) + " (auto)" : "ongoing") + '"></div>' +
          "</div>" +
          '<div class="field"><label class="lbl">What</label><input type="text" data-f="narration" value="' + escapeHtml(e.narration) + '"></div>' +
          '<div class="field"><label class="lbl">Category</label><input type="text" data-f="category" value="' + escapeHtml(e.category) + '"></div>' +
          '<div class="form-actions">' +
            '<button type="button" class="btn btn-primary btn-small" data-act="save">Save</button>' +
            '<button type="button" class="btn btn-ghost btn-small" data-act="cancel">Cancel</button>' +
            '<button type="button" class="btn btn-small btn-danger" data-act="delete">Delete</button>' +
          "</div>" +
        "</div>" +
      "</li>";
    }).join("");
  }

  // ---------- mutations ----------
  function addEntry(hhmm, narration, category) {
    var startAt = makeStartAt(viewDate, hhmm);
    category = category.trim();
    queueMutation(function (s) {
      s.entries.push({
        id: uid(), startAt: startAt,
        narration: narration.trim(), category: category, stop: false,
        createdAt: new Date().toISOString()
      });
      if (category && s.categories.indexOf(category) < 0) s.categories.push(category);
      return s;
    });
  }
  function addStop(hhmm) {
    var startAt = makeStartAt(viewDate, hhmm);
    queueMutation(function (s) {
      s.entries.push({ id: uid(), startAt: startAt, narration: "", category: "", stop: true, createdAt: new Date().toISOString() });
      return s;
    });
  }
  function updateEntry(id, patch) {
    queueMutation(function (s) {
      s.entries = s.entries.map(function (e) {
        if (e.id !== id) return e;
        var next = Object.assign({}, e);
        if (patch.time) next.startAt = makeStartAt(dateKey(new Date(e.startAt)), patch.time);
        if ("end" in patch) {
          if (!patch.end) {
            next.endAt = "";
          } else {
            var sd = new Date(next.startAt), tp = patch.end.split(":");
            var ed = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate(), +tp[0], +tp[1], 0, 0);
            // an end at or before the start means it ran past midnight
            if (ed.getTime() <= sd.getTime()) ed.setDate(ed.getDate() + 1);
            next.endAt = ed.toISOString();
          }
        }
        if ("narration" in patch) next.narration = patch.narration.trim();
        if ("category" in patch) next.category = patch.category.trim();
        return next;
      });
      return s;
    });
  }
  function deleteEntry(id) {
    queueMutation(function (s) {
      s.entries = s.entries.filter(function (e) { return e.id !== id; });
      return s;
    });
  }

  // ---------- add form ----------
  var fTime = document.getElementById("f-time");
  var fNarr = document.getElementById("f-narration");
  var fCat = document.getElementById("f-category");

  var agoBtn = document.getElementById("agoBtn");
  var agoN = 0; // 0 = not stepped back yet; cycles 1 → 2 → 3 → 1
  function resetAgo() { agoN = 0; agoBtn.textContent = "1 min ago"; }
  document.getElementById("nowBtn").addEventListener("click", function () { fTime.value = nowHHMM(); resetAgo(); });
  agoBtn.addEventListener("click", function () {
    agoN = (agoN % 3) + 1;
    fTime.value = hhmmMinsAgo(agoN);
    agoBtn.textContent = agoN + " min ago";
  });

  attachTimeInput(fTime);
  // focusing the new-entry time field clears it so you can type fresh 4 digits
  // (the inline edit field keeps its value)
  fTime.addEventListener("focus", function () { fTime.value = ""; });
  // once a full 4-digit time is in, jump to the narration field automatically
  fTime.addEventListener("input", function () {
    var digits = fTime.value.replace(/\D/g, "");
    if (digits.length === 4) {
      var t = normTime(digits);
      if (t) { fTime.value = t; fNarr.focus(); }
    }
  });

  document.getElementById("addForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var t = fTime.value.trim() ? normTime(fTime.value) : nowHHMM();
    if (!t) { fTime.value = ""; fTime.focus(); return; }
    fTime.value = t;
    if (!fNarr.value.trim()) { fNarr.focus(); return; }
    addEntry(t, fNarr.value, fCat.value);
    fNarr.value = "";
    fTime.value = nowHHMM();
    resetAgo();
    hideAc();
    fNarr.focus();
  });

  document.getElementById("stopBtn").addEventListener("click", function () {
    addStop(normTime(fTime.value) || nowHHMM());
  });

  // category autocomplete
  var acList = document.getElementById("categoryAc");
  var acActive = -1;
  function acMatches() {
    var q = fCat.value.trim().toLowerCase();
    var counts = {};
    state.entries.forEach(function (e) { if (e.category) counts[e.category] = (counts[e.category] || 0) + 1; });
    return state.categories
      .filter(function (c) { return !q || c.toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { return (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b); })
      .slice(0, 8)
      .map(function (c) { return { name: c, count: counts[c] || 0 }; });
  }
  function showAc() {
    var m = acMatches();
    if (!m.length) { hideAc(); return; }
    acActive = -1;
    acList.innerHTML = m.map(function (x, i) {
      return '<div class="ac-item" data-i="' + i + '" data-name="' + escapeHtml(x.name) + '">' +
        escapeHtml(x.name) + (x.count ? '<span class="cnt">' + x.count + "×</span>" : "") + "</div>";
    }).join("");
    acList.hidden = false;
    fCat.setAttribute("aria-expanded", "true");
  }
  function hideAc() { acList.hidden = true; acActive = -1; fCat.setAttribute("aria-expanded", "false"); }
  // clicking into the category field clears whatever's there (it stays filled after
  // a log as a sticky default) so a fresh pick / type is quick
  fCat.addEventListener("focus", function () { fCat.value = ""; });
  fCat.addEventListener("focus", showAc);
  fCat.addEventListener("input", showAc);
  fCat.addEventListener("blur", function () { setTimeout(hideAc, 120); });
  fCat.addEventListener("keydown", function (ev) {
    if (acList.hidden) return;
    var items = acList.querySelectorAll(".ac-item");
    if (ev.key === "ArrowDown") { ev.preventDefault(); acActive = Math.min(acActive + 1, items.length - 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); acActive = Math.max(acActive - 1, 0); }
    else if (ev.key === "Enter" && acActive >= 0) { ev.preventDefault(); fCat.value = items[acActive].dataset.name; hideAc(); return; }
    else if (ev.key === "Escape") { hideAc(); return; }
    else return;
    items.forEach(function (el, i) { el.classList.toggle("active", i === acActive); });
  });
  acList.addEventListener("mousedown", function (ev) {
    var item = ev.target.closest(".ac-item");
    if (!item) return;
    ev.preventDefault();
    fCat.value = item.dataset.name;
    hideAc();
  });

  // ---------- timeline interactions ----------
  document.getElementById("timeline").addEventListener("click", function (ev) {
    var stopLi = ev.target.closest(".stopmark");
    if (stopLi && ev.target.dataset.act === "del-stop") { deleteEntry(stopLi.dataset.id); return; }

    var li = ev.target.closest(".entry");
    if (!li) return;
    var id = li.dataset.id;
    var editBox = li.querySelector(".entry-edit");
    var act = ev.target.dataset.act;

    if (ev.target.closest(".entry-head") && !act) {
      var willOpen = editBox.hidden;
      document.querySelectorAll(".entry-edit").forEach(function (b) { b.hidden = true; });
      editBox.hidden = !willOpen;
      if (willOpen) {
        attachTimeInput(editBox.querySelector('[data-f="time"]'));
        attachTimeInput(editBox.querySelector('[data-f="end"]'));
      }
      return;
    }
    if (act === "cancel") { editBox.hidden = true; render(); return; }
    if (act === "delete") { if (confirm("Delete this entry?")) deleteEntry(id); return; }
    if (act === "save") {
      var timeEl = editBox.querySelector('[data-f="time"]');
      var t = normTime(timeEl.value);
      if (!t) { timeEl.focus(); return; }
      var endEl = editBox.querySelector('[data-f="end"]');
      var endRaw = endEl.value.trim();
      var endNorm = endRaw ? normTime(endRaw) : "";
      if (endRaw && !endNorm) { endEl.focus(); return; }
      updateEntry(id, {
        time: t,
        end: endNorm,
        narration: editBox.querySelector('[data-f="narration"]').value,
        category: editBox.querySelector('[data-f="category"]').value
      });
    }
  });

  // ---------- day navigation ----------
  function shiftDay(delta) {
    var d = keyToDate(viewDate);
    d.setDate(d.getDate() + delta);
    viewDate = dateKey(d);
    render();
  }
  document.getElementById("prevDay").addEventListener("click", function () { shiftDay(-1); });
  document.getElementById("nextDay").addEventListener("click", function () { shiftDay(1); });
  document.getElementById("datePicker").addEventListener("change", function (ev) {
    if (ev.target.value) { viewDate = ev.target.value; render(); }
  });

  // keep the "now" ticking for the ongoing entry
  setInterval(function () {
    if (viewDate === todayKey() && document.querySelector(".entry-dur.ongoing")) {
      renderSummary(); renderTimeline();
    }
  }, 30000);

  // ---------- sync modal ----------
  var syncModal = document.getElementById("syncModal");
  var syncTokenInput = document.getElementById("syncTokenInput");
  var syncTokenStatus = document.getElementById("syncTokenStatus");
  function openSyncModal() { syncTokenInput.value = getToken(); syncTokenStatus.textContent = ""; syncModal.classList.add("open"); }
  function closeSyncModal() { syncModal.classList.remove("open"); }
  document.getElementById("syncPill").addEventListener("click", function () {
    if (syncMode === "error") { flushToRemote(); return; }
    openSyncModal();
  });
  document.getElementById("closeSyncModal").addEventListener("click", closeSyncModal);
  syncModal.addEventListener("click", function (ev) { if (ev.target === syncModal) closeSyncModal(); });
  document.getElementById("saveSyncKey").addEventListener("click", function () {
    var token = syncTokenInput.value.trim();
    if (!token) { syncTokenStatus.textContent = "Paste a token first."; syncTokenStatus.style.color = "var(--danger)"; return; }
    syncTokenStatus.textContent = "Checking…"; syncTokenStatus.style.color = "var(--ink-soft)";
    setToken(token);
    setCachedGistId("");
    initSync().then(function () {
      if (syncMode === "synced") {
        syncTokenStatus.textContent = "Connected — this device is syncing.";
        syncTokenStatus.style.color = "var(--accent)";
        setTimeout(closeSyncModal, 900);
      } else if (syncMode === "badtoken") {
        syncTokenStatus.textContent = "That key didn't work — check it has “gist” access.";
        syncTokenStatus.style.color = "var(--danger)";
      } else {
        syncTokenStatus.textContent = "GitHub rejected the request — check the key and try again.";
        syncTokenStatus.style.color = "var(--danger)";
      }
    });
  });
  document.getElementById("removeSyncKey").addEventListener("click", function () {
    setToken(""); setCachedGistId("");
    syncTokenInput.value = "";
    setSyncStatus("local");
    syncTokenStatus.textContent = "Sync key removed — this device is local only now.";
    syncTokenStatus.style.color = "var(--ink-soft)";
  });

  // ---------- backup modal ----------
  var backupModal = document.getElementById("backupModal");
  var backupText = document.getElementById("backupText");
  var backupStatus = document.getElementById("backupStatus");
  document.getElementById("backupBtn").addEventListener("click", function () {
    backupText.value = JSON.stringify(state, null, 2);
    backupStatus.textContent = "";
    document.getElementById("backupNote").textContent = getToken()
      ? "Your entries sync automatically through your GitHub sync key. This panel is a manual copy for an extra backup."
      : "Sync isn't set up on this device, so entries are saved only in this browser. Copy this somewhere safe, or paste a backup back in to restore.";
    backupModal.classList.add("open");
  });
  document.getElementById("closeBackup").addEventListener("click", function () { backupModal.classList.remove("open"); });
  backupModal.addEventListener("click", function (ev) { if (ev.target === backupModal) backupModal.classList.remove("open"); });
  document.getElementById("copyBackup").addEventListener("click", function () {
    backupText.select();
    try { document.execCommand("copy"); backupStatus.textContent = "Copied."; backupStatus.style.color = "var(--accent)"; }
    catch (e) { backupStatus.textContent = "Press ⌘/Ctrl+C to copy."; }
  });
  document.getElementById("restoreBackup").addEventListener("click", function () {
    var parsed;
    try { parsed = JSON.parse(backupText.value); }
    catch (e) { backupStatus.textContent = "That isn't valid JSON."; backupStatus.style.color = "var(--danger)"; return; }
    if (!confirm("Replace all current entries with this backup?")) return;
    queueMutation(function () { return normalizeState(parsed); });
    backupStatus.textContent = "Restored.";
    backupStatus.style.color = "var(--accent)";
    setTimeout(function () { backupModal.classList.remove("open"); }, 700);
  });

  // ---------- init ----------
  fTime.value = nowHHMM();
  initSync();
})();
</script>
</body>
</html>
