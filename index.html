<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e6edf3;
    --surface: #f3f8fb;
    --surface-raised: #fcfeff;
    --ink: #1b2e3d;
    --ink-soft: #4d6577;
    --ink-faint: #8098a8;
    --line: #c2d3de;
    --line-soft: #d6e2ea;
    --accent: #1f6f6b;
    --accent-ink: #fcfeff;
    --accent-soft: #dceae7;
    --accent-soft-line: #b9d6d2;
    --danger: #9b3b2c;
    --danger-soft: #f1e2de;
    --good: #1f7a3d;
    --good-soft: #dcecE1;
    --shadow: 0 1px 2px rgba(20, 35, 48, 0.07), 0 4px 14px rgba(20, 35, 48, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1a24; --surface: #16232f; --surface-raised: #1c2c3a;
      --ink: #e2edf4; --ink-soft: #a9bfcf; --ink-faint: #708494;
      --line: #2b3f4d; --line-soft: #223543;
      --accent: #4fbbb3; --accent-ink: #0c1b1a; --accent-soft: #1f3a37; --accent-soft-line: #2f5551;
      --danger: #e28468; --danger-soft: #392722;
      --good: #5abd77; --good-soft: #1c3626;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1a24; --surface: #16232f; --surface-raised: #1c2c3a;
    --ink: #e2edf4; --ink-soft: #a9bfcf; --ink-faint: #708494;
    --line: #2b3f4d; --line-soft: #223543;
    --accent: #4fbbb3; --accent-ink: #0c1b1a; --accent-soft: #1f3a37; --accent-soft-line: #2f5551;
    --danger: #e28468; --danger-soft: #392722;
    --good: #5abd77; --good-soft: #1c3626;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 18px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Catamaran", system-ui, -apple-system, sans-serif;
    margin: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .shell { max-width: 640px; margin: 0 auto; padding: 0 1.1rem 5rem; }

  /* ---------- header ---------- */
  header.top { padding: 1.4rem 0 0.9rem; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
  .header-row h1 {
    font-size: 1.15rem; font-weight: 700; margin: 0; letter-spacing: 0.01em;
  }
  .iconbtn {
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink-soft);
    width: 2.1rem; height: 2.1rem; border-radius: 9px; font-size: 1rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .iconbtn:hover { color: var(--ink); }
  .sync-pill {
    margin-top: 0.5rem; border: 0; background: none; padding: 0; cursor: pointer;
    font: inherit; font-size: 0.78rem; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .sync-pill::before {
    content: ""; width: 0.5rem; height: 0.5rem; border-radius: 999px;
    background: currentColor; flex-shrink: 0;
  }
  .sync-pill.ok { color: var(--accent); }
  .sync-pill.err { color: var(--danger); text-decoration: underline; }

  /* ---------- add form ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 1.1rem; box-shadow: var(--shadow);
    margin-bottom: 1.4rem;
  }
  .row { display: flex; gap: 0.6rem; }
  .row > * { min-width: 0; }
  .field { margin-bottom: 0.7rem; position: relative; }
  .field:last-child { margin-bottom: 0; }
  label.lbl {
    display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 0.28rem;
  }
  .time-in { font-family: "JetBrains Mono", monospace; letter-spacing: 0.05em; }
  input[type="text"], input[type="time"], input[type="date"], textarea {
    width: 100%; font: inherit; font-size: 0.95rem;
    background: var(--surface-raised); color: var(--ink);
    border: 1px solid var(--line); border-radius: 9px; padding: 0.55rem 0.65rem;
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .time-wrap { display: flex; gap: 0.4rem; }
  .time-wrap input { flex: 1; }
  .check-row {
    display: flex; align-items: flex-start; gap: 0.5rem; margin: 0.6rem 0 0.2rem;
    font-size: 0.85rem; color: var(--ink-soft); line-height: 1.35; cursor: pointer;
  }
  .check-row input { width: auto; margin-top: 0.15rem; flex-shrink: 0; }
  .lbl .opt { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink-faint); }
  .btn {
    font: inherit; font-weight: 700; border-radius: 9px; padding: 0.55rem 0.9rem;
    cursor: pointer; border: 1px solid transparent; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-ghost { background: var(--surface-raised); color: var(--ink-soft); border-color: var(--line); }
  .btn-ghost:hover { color: var(--ink); }
  .btn-small { padding: 0.4rem 0.7rem; font-size: 0.82rem; font-weight: 600; }
  .form-actions { display: flex; gap: 0.6rem; margin-top: 0.9rem; }
  .form-actions .btn-primary { flex: 1; }

  /* category autocomplete */
  .ac-list {
    position: absolute; left: 0; right: 0; top: calc(100% + 3px); z-index: 8;
    background: var(--surface-raised); border: 1px solid var(--line); border-radius: 9px;
    box-shadow: var(--shadow); overflow: hidden; max-height: 220px; overflow-y: auto;
  }
  .ac-list[hidden] { display: none; }
  .ac-item {
    padding: 0.5rem 0.65rem; font-size: 0.9rem; cursor: pointer;
    display: flex; justify-content: space-between; gap: 0.5rem;
  }
  .ac-item:hover, .ac-item.active { background: var(--accent-soft); color: var(--accent); }
  .ac-item .cnt { color: var(--ink-faint); font-size: 0.78rem; }

  /* ---------- day navigation ---------- */
  .daynav { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.9rem; }
  .daynav .date-label { font-weight: 700; font-size: 1rem; flex: 1; }
  .date-label .rel { color: var(--ink-faint); font-weight: 500; font-size: 0.85rem; margin-left: 0.35rem; }
  .daynav input[type="date"] { width: auto; padding: 0.3rem 0.4rem; font-size: 0.8rem; }

  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem 0.9rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
  .home-head .date-label { font-weight: 700; font-size: 1rem; }
  .home-links { display: inline-flex; gap: 0.9rem; flex-shrink: 0; flex-wrap: wrap; }
  .linkbtn { border: 0; background: none; font: inherit; font-weight: 700; color: var(--accent); cursor: pointer; padding: 0; }

  .show-more { width: 100%; margin-top: 0.3rem; }

  /* ---------- goals page ---------- */
  .goals-intro { font-size: 0.85rem; color: var(--ink-soft); line-height: 1.55; margin: 0 0 1rem; }
  .goals-intro code {
    font-family: "JetBrains Mono", monospace; font-size: 0.78rem;
    background: var(--line-soft); padding: 0.05rem 0.3rem; border-radius: 4px;
  }
  .goals-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .goals-tab {
    flex: 1; padding: 0.5rem 0.4rem; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-raised); color: var(--ink-soft); font: inherit; font-weight: 700; cursor: pointer;
  }
  .goals-tab.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  .goal-section { border-radius: 10px; padding: 0.2rem 0.6rem; transition: background 0.12s; }
  .goal-section.drop-target { background: var(--accent-soft); }
  .goal-section-label { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin: 0.7rem 0 0.1rem; }
  .goal-section-label .dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 3px; margin-right: 0.4rem; }
  .goal-section.invest .goal-section-label { color: var(--good); }
  .goal-section.limit .goal-section-label { color: var(--danger); }
  .goal-section-sub { font-size: 0.78rem; color: var(--ink-faint); margin: 0 0 0.3rem; }
  .goal-section-hint { font-size: 0.82rem; color: var(--ink-faint); padding: 0.6rem 0; }
  .task-meta { font-weight: 500; font-size: 0.74rem; color: var(--ink-faint); margin-left: 0.5rem; white-space: nowrap; flex-shrink: 0; }

  .goal-divider {
    display: flex; align-items: center; gap: 0.7rem; margin: 1rem 0;
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint);
  }
  .goal-divider::before, .goal-divider::after { content: ""; flex: 1; height: 2px; background: var(--line); }

  .goal-row { display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0; border-bottom: 1px solid var(--line-soft); }
  .goal-row:last-child { border-bottom: 0; }
  .goal-row.dragging { opacity: 0.35; }
  .goal-move {
    border: 1px solid var(--line); background: var(--surface-raised); color: var(--ink-soft);
    width: 1.7rem; height: 1.7rem; border-radius: 6px; flex-shrink: 0; cursor: grab;
    font-size: 0.85rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  }
  .goal-cat { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
  .goal-cat .dot { width: 0.7rem; height: 0.7rem; border-radius: 3px; flex-shrink: 0; }
  .goal-cat-name { min-width: 0; overflow-wrap: break-word; }
  .goal-row .goal-input {
    width: 6.5rem; flex: 0 0 6.5rem; text-align: right;
    font-family: "JetBrains Mono", monospace; font-weight: 700;
  }
  .goal-row .goal-input.invest { color: var(--good); }
  .goal-row .goal-input.limit { color: var(--danger); }
  .goals-empty { color: var(--ink-faint); font-size: 0.9rem; padding: 1.5rem 0; }

  /* ---------- overview page ---------- */
  .ov-gist {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.9rem 1rem; margin-bottom: 1.1rem; box-shadow: var(--shadow);
    font-size: 0.95rem; line-height: 1.5; color: var(--ink-soft);
  }
  .ov-gist b { color: var(--ink); }
  .ov-gist-line { margin-top: 0.35rem; font-size: 0.85rem; }
  .ov-section-label {
    font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-faint); margin: 1.1rem 0 0.7rem;
  }
  .ov-row { margin-bottom: 1rem; }
  .ov-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; margin-bottom: 0.3rem; }
  .ov-row-name { font-weight: 700; display: flex; align-items: center; gap: 0.45rem; min-width: 0; overflow-wrap: anywhere; }
  .ov-row-name .dot { width: 0.65rem; height: 0.65rem; border-radius: 3px; flex-shrink: 0; }
  .ov-row-nums { font-family: "JetBrains Mono", monospace; font-size: 0.82rem; color: var(--ink-soft); flex-shrink: 0; white-space: nowrap; }
  .ov-track { position: relative; height: 0.7rem; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
  .ov-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 999px; min-width: 2px; }
  .ov-goal-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); opacity: 0.6; }
  .ov-status { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.78rem; margin-top: 0.28rem; color: var(--ink-faint); }
  .ov-status .good { color: var(--good); font-weight: 700; }
  .ov-status .bad { color: var(--danger); font-weight: 700; }
  .ov-kind.invest { color: var(--good); font-weight: 700; }
  .ov-kind.limit { color: var(--danger); font-weight: 700; }
  .ov-empty { color: var(--ink-faint); font-size: 0.9rem; padding: 2rem 0; }
  .ov-actions { display: flex; gap: 0.6rem; margin-top: 1.6rem; flex-wrap: wrap; }
  .ov-actions .btn { flex: 1; min-width: 9rem; }

  /* ---------- day summary ---------- */
  .summary { margin-bottom: 1rem; }
  .summary-total { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 0.5rem; }
  .summary-total b { color: var(--ink); font-size: 1.05rem; }
  .cat-bar { display: flex; height: 0.5rem; border-radius: 999px; overflow: hidden; background: var(--line-soft); }
  .cat-bar span { display: block; height: 100%; }
  .cat-legend { display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; margin-top: 0.5rem; }
  .cat-legend .lg { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--ink-soft); }
  .cat-legend .dot { width: 0.6rem; height: 0.6rem; border-radius: 3px; flex-shrink: 0; }
  .along-summary { margin-top: 0.6rem; padding-top: 0.55rem; border-top: 1px dashed var(--line); }
  .along-summary .along-head { font-size: 0.83rem; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .along-summary .along-head b { color: var(--ink); }

  /* ---------- timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .entry {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 0.7rem 0.8rem; margin-bottom: 0.55rem; box-shadow: var(--shadow);
  }
  .entry-head { display: flex; align-items: flex-start; gap: 0.7rem; cursor: pointer; }
  .entry-time {
    font-family: "JetBrains Mono", monospace; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: stretch; text-align: center;
    min-width: 4rem; border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
  }
  .entry-time .t-start {
    font-size: 1.1rem; font-weight: 600; color: var(--ink);
    padding: 0.2rem 0.45rem 0.1rem;
  }
  .t-dur {
    font-size: 1rem; font-weight: 700; color: var(--accent-ink); background: var(--accent);
    padding: 0.18rem 0.45rem; white-space: nowrap; line-height: 1.2;
  }
  .t-dur.muted { background: var(--line-soft); color: var(--ink-faint); }
  .t-dur.manual { box-shadow: inset 0 2px 0 var(--accent-soft-line); }
  .t-dur .now { display: block; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .dur-stop {
    margin-left: 0.3rem; border: 0; background: none; color: var(--accent-ink); cursor: pointer;
    font-size: 0.75rem; line-height: 1; padding: 0; opacity: 0.9;
  }
  .entry.alongside { margin-left: 1.4rem; border-left: 3px solid var(--accent-soft-line); }
  .entry-main { flex: 1; min-width: 0; }
  .entry-cat-total {
    flex-shrink: 0; align-self: center; font-family: "JetBrains Mono", monospace;
    font-size: 0.95rem; font-weight: 700; white-space: nowrap; text-align: right;
  }
  .entry-task { font-size: 0.95rem; font-weight: 700; line-height: 1.35; word-wrap: break-word; color: var(--ink); }
  .entry-category {
    display: inline-block; margin-top: 0.3rem; font-size: 0.72rem; font-weight: 700;
    border-radius: 999px; padding: 0.14rem 0.55rem; letter-spacing: 0.01em;
  }
  .entry-edit { margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px solid var(--line-soft); }
  .entry-edit[hidden] { display: none; }
  .entry-edit .form-actions { margin-top: 0.7rem; }
  .entry-edit .btn-danger { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  .stopmark {
    display: flex; align-items: center; gap: 0.6rem; margin: 0.3rem 0 0.7rem;
    font-family: "JetBrains Mono", monospace; font-size: 0.75rem; color: var(--ink-faint);
  }
  .stopmark::before, .stopmark::after { content: ""; height: 1px; background: var(--line); flex: 1; }
  .stopmark button { border: 0; background: none; color: var(--danger); cursor: pointer; font: inherit; }

  .empty { text-align: center; color: var(--ink-faint); font-size: 0.9rem; padding: 2rem 1rem; }

  /* ---------- modal ---------- */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(10, 17, 24, 0.5);
    z-index: 20; align-items: flex-start; justify-content: center; padding: 5vh 1rem; overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    max-width: 520px; width: 100%; padding: 1.3rem; box-shadow: var(--shadow);
  }
  .modal h2 { font-size: 1.15rem; margin: 0 0 0.3rem; }
  .modal p.note { font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 1rem; line-height: 1.5; }
  .modal textarea { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; min-height: 7rem; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.1rem; flex-wrap: wrap; }
  .status-line { font-size: 0.83rem; margin-top: 0.5rem; min-height: 1.1em; font-weight: 600; }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="header-row">
      <button class="iconbtn" id="backHome" aria-label="Back to today" hidden>‹</button>
      <h1 id="pageTitle">Time Tracker</h1>
      <button class="iconbtn" id="backupBtn" title="Backup / restore" aria-label="Backup or restore">⇅</button>
    </div>
    <button class="sync-pill" id="syncPill" type="button">Checking sync…</button>
  </header>

  <!-- ADD -->
  <div class="panel" id="addPanel">
    <form id="addForm" autocomplete="off">
      <div class="field">
        <label class="lbl" for="f-time">Start time</label>
        <div class="time-wrap">
          <input type="text" id="f-time" class="time-in" inputmode="numeric" autocomplete="off"
                 maxlength="5" placeholder="0930" aria-label="Start time, 24-hour, type four digits" required>
          <button type="button" class="btn btn-ghost btn-small" id="nowBtn">Now</button>
          <button type="button" class="btn btn-ghost btn-small" id="agoBtn" title="Tap to step back a minute at a time">1 min ago</button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="f-task">Tasks</label>
        <input type="text" id="f-task" placeholder="e.g. Reviewed pull requests" required>
      </div>
      <div class="field">
        <label class="lbl" for="f-category">Category</label>
        <input type="text" id="f-category" placeholder="e.g. Work" role="combobox" aria-autocomplete="list" aria-expanded="false">
        <div class="ac-list" id="categoryAc" hidden></div>
      </div>
      <label class="check-row">
        <input type="checkbox" id="f-concurrent"> Runs alongside another task (doesn't end the current one)
      </label>
      <div class="field" id="f-end-field" hidden>
        <label class="lbl" for="f-end">End time <span class="opt">— optional, blank means ongoing</span></label>
        <input type="text" id="f-end" class="time-in" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="ongoing">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="logBtn">Log entry</button>
        <button type="button" class="btn btn-ghost" id="stopBtn" title="Mark the end of the current task">Stop</button>
      </div>
    </form>
  </div>

  <!-- HOME: heading above the recent-entries preview -->
  <div class="home-head" id="homeHead">
    <span class="date-label" id="homeDateLabel"></span>
    <span class="home-links">
      <button type="button" class="linkbtn" id="toOverview">Overview</button>
      <button type="button" class="linkbtn" id="toGoals">Goals</button>
      <button type="button" class="linkbtn" id="toTasks">Tasks</button>
    </span>
  </div>

  <!-- DAY: full-day view with date navigation -->
  <div class="daynav" id="daynav" hidden>
    <button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
    <span class="date-label" id="dateLabel"></span>
    <input type="date" id="datePicker">
    <button class="iconbtn" id="nextDay" aria-label="Next day">›</button>
  </div>

  <div class="summary" id="summary" hidden></div>
  <ul class="timeline" id="timeline"></ul>
  <button class="btn btn-ghost show-more" id="showMore" type="button" hidden></button>

  <!-- GOALS: per-category / per-task daily targets -->
  <div id="goalsPage" hidden>
    <div id="goalsList"></div>
  </div>

  <!-- OVERVIEW: at-a-glance day breakdown -->
  <div id="overviewPage" hidden>
    <div id="overviewBody"></div>
    <div class="ov-actions">
      <button type="button" class="btn btn-ghost btn-small" id="ovCopy">Copy report for ChatGPT</button>
      <button type="button" class="btn btn-ghost btn-small" id="ovCsv">Download CSV</button>
    </div>
  </div>
</div>

<!-- sync modal -->
<div class="modal-backdrop" id="syncModal">
  <div class="modal">
    <h2>Sync across devices</h2>
    <p class="note">Your entries are stored in a private Gist on your GitHub account. Create a personal access token scoped only to “gist” (it can’t touch your repos), then paste it below — once per device.</p>
    <p><a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=Time%20Tracker%20sync" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;">Create a gist-only token on GitHub →</a></p>
    <div class="field">
      <label class="lbl" for="syncTokenInput">Sync key</label>
      <input type="password" id="syncTokenInput" placeholder="ghp_…" autocomplete="off">
    </div>
    <div class="status-line" id="syncTokenStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-small" id="removeSyncKey">Remove key</button>
      <button class="btn btn-ghost btn-small" id="closeSyncModal">Close</button>
      <button class="btn btn-primary btn-small" id="saveSyncKey">Save</button>
    </div>
  </div>
</div>

<!-- backup modal -->
<div class="modal-backdrop" id="backupModal">
  <div class="modal">
    <h2>Backup / restore</h2>
    <p class="note" id="backupNote"></p>
    <textarea id="backupText" spellcheck="false"></textarea>
    <div class="status-line" id="backupStatus"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-small" id="closeBackup">Close</button>
      <button class="btn btn-ghost btn-small" id="copyBackup">Copy</button>
      <button class="btn btn-primary btn-small" id="restoreBackup">Restore from text</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "time-tracker-data";
  var TOKEN_KEY = "time-tracker-gh-token";
  var GIST_ID_KEY = "time-tracker-gist-id";
  var GITHUB_API = "https://api.github.com";
  var GIST_FILENAME = "time-tracker.json";

  var state = { entries: [], categories: [], goals: {}, goalKinds: {}, taskGoals: {} };
  var pendingSync = false;
  var flushTimer = null;
  var syncMode = "init";
  var viewDate = todayKey();
  var route = "home";              // home · day · overview · goals
  var goalsView = "categories";    // within the goals route: "categories" or "tasks"

  // ---------- helpers ----------
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayKey() { return dateKey(new Date()); }
  function dateKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function keyToDate(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

  function nowHHMM() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function hhmmMinsAgo(mins) { var d = new Date(Date.now() - mins * 60000); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }

  // "0930" / "930" / "9:30" -> "09:30"; last two digits are minutes, the rest is the hour.
  // returns "" if the digits don't make a valid 24-hour time.
  function normTime(raw) {
    var s = String(raw == null ? "" : raw).replace(/\D/g, "");
    if (!s) return "";
    var h, m;
    if (s.length <= 2) { h = +s; m = 0; }
    else { h = +s.slice(0, -2); m = +s.slice(-2); }
    if (h > 23 || m > 59) return "";
    return pad(h) + ":" + pad(m);
  }
  // live: drop non-digits, cap at 4, and slot a colon before the last two
  function liveTimeFormat(raw) {
    var s = String(raw == null ? "" : raw).replace(/\D/g, "").slice(0, 4);
    return s.length >= 3 ? s.slice(0, -2) + ":" + s.slice(-2) : s;
  }
  function attachTimeInput(el) {
    el.addEventListener("input", function () {
      var start = el.selectionStart, before = el.value;
      el.value = liveTimeFormat(el.value);
      if (start === before.length) el.setSelectionRange(el.value.length, el.value.length);
    });
    el.addEventListener("blur", function () {
      var t = normTime(el.value);
      if (t) el.value = t;
    });
  }

  // combine a day key (YYYY-MM-DD) + HH:MM into a local ISO timestamp
  function makeStartAt(dayK, hhmm) {
    var dp = dayK.split("-"), tp = hhmm.split(":");
    var d = new Date(+dp[0], +dp[1] - 1, +dp[2], +tp[0], +tp[1], 0, 0);
    return d.toISOString();
  }
  // an end HH:MM on the same day as startIso; if it lands at/before the start it
  // ran past midnight, so bump a day. "" hhmm -> "" (no end).
  function makeEndAt(startIso, hhmm) {
    if (!hhmm) return "";
    var sd = new Date(startIso), tp = hhmm.split(":");
    var ed = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate(), +tp[0], +tp[1], 0, 0);
    if (ed.getTime() <= sd.getTime()) ed.setDate(ed.getDate() + 1);
    return ed.toISOString();
  }
  function fmtClock(iso) { var d = new Date(iso); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function fmtDuration(ms) {
    if (ms < 0) ms = 0;
    var mins = Math.round(ms / 60000);
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h && m) return h + "h " + m + "m";
    if (h) return h + "h";
    return m + "m";
  }
  function fmtMins(mins) { return fmtDuration((mins || 0) * 60000); }
  // "1h 30m" / "1:30" / "90" / "90m" / "1.5h" -> minutes (0 if unparseable / empty)
  function parseDuration(str) {
    str = String(str == null ? "" : str).trim().toLowerCase();
    if (!str) return 0;
    var colon = str.match(/^(\d+):([0-5]?\d)$/);
    if (colon) return (+colon[1]) * 60 + (+colon[2]);
    var total = 0, hit = false;
    var hh = str.match(/(\d+(?:\.\d+)?)\s*h/);
    if (hh) { total += Math.round(parseFloat(hh[1]) * 60); hit = true; }
    var mm = str.match(/(\d+)\s*m/);
    if (mm) { total += +mm[1]; hit = true; }
    if (!hit) {
      var n = parseFloat(str);
      return isNaN(n) ? 0 : Math.round(n); // a bare number is minutes
    }
    return total;
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function relLabel(k) {
    var diff = Math.round((keyToDate(k) - keyToDate(todayKey())) / 86400000);
    if (diff === 0) return "today";
    if (diff === -1) return "yesterday";
    if (diff === 1) return "tomorrow";
    return null;
  }

  var CAT_COLORS = ["#1f6f6b", "#c98a2b", "#6a5acd", "#b5546a", "#3f7fbf", "#4f9d5d", "#9b6b3b", "#7d7d90"];
  function catColor(name) {
    var list = state.categories.length ? state.categories : [];
    var i = list.indexOf(name);
    if (i < 0) i = Math.abs(hashStr(name)) % CAT_COLORS.length;
    return CAT_COLORS[i % CAT_COLORS.length];
  }
  function hashStr(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i) | 0; return h; }
  // black or white text, whichever reads better on the given hex background
  function contrastText(hex) {
    var c = hex.replace("#", "");
    var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.62 ? "#141414" : "#ffffff";
  }
  function catStyle(name) {
    var bg = catColor(name);
    return "background:" + bg + ";color:" + contrastText(bg);
  }

  // ---------- state ----------
  function emptyState() { return { entries: [], categories: [], goals: {}, goalKinds: {}, taskGoals: {} }; }

  function normalizeState(raw) {
    raw = (raw && typeof raw === "object") ? raw : {};
    var entries = (Array.isArray(raw.entries) ? raw.entries : []).map(function (e) {
      // `type` is the old field name, kept here so existing data still loads
      var cat = typeof e.category === "string" ? e.category : (typeof e.type === "string" ? e.type : "");
      return {
        id: e.id || uid(),
        startAt: e.startAt || (e.date && e.start ? makeStartAt(e.date, e.start) : new Date().toISOString()),
        // optional manual end; for a main entry, empty means "next entry's start"
        endAt: e.endAt && !isNaN(new Date(e.endAt)) ? new Date(e.endAt).toISOString() : "",
        // an "alongside" entry runs concurrently and is left out of the chain
        concurrent: !!e.concurrent,
        task: typeof e.task === "string" ? e.task : (typeof e.narration === "string" ? e.narration : ""),
        category: cat,
        stop: !!e.stop,
        createdAt: e.createdAt || new Date().toISOString()
      };
    }).filter(function (e) { return !isNaN(new Date(e.startAt)); });
    entries.sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });

    var catSet = {};
    var rawCats = Array.isArray(raw.categories) ? raw.categories : (Array.isArray(raw.types) ? raw.types : []);
    rawCats.forEach(function (t) { if (t) catSet[t] = true; });
    entries.forEach(function (e) { if (e.category) catSet[e.category] = true; });

    // per-category daily goal, in minutes
    var goals = {};
    if (raw.goals && typeof raw.goals === "object") {
      Object.keys(raw.goals).forEach(function (k) {
        var v = Math.round(+raw.goals[k]);
        if (k && v > 0) goals[k] = v;
      });
    }
    // "invest" (spend more, green) is the default; only "limit" (spend less, red) is stored
    var goalKinds = {};
    if (raw.goalKinds && typeof raw.goalKinds === "object") {
      Object.keys(raw.goalKinds).forEach(function (k) {
        if (k && raw.goalKinds[k] === "limit") goalKinds[k] = "limit";
      });
    }
    // per-task daily budgets, keyed "category\ntask", in minutes
    var taskGoals = {};
    if (raw.taskGoals && typeof raw.taskGoals === "object") {
      Object.keys(raw.taskGoals).forEach(function (k) {
        var v = Math.round(+raw.taskGoals[k]);
        if (k && v > 0) taskGoals[k] = v;
      });
    }
    return {
      entries: entries, categories: Object.keys(catSet).sort(),
      goals: goals, goalKinds: goalKinds, taskGoals: taskGoals
    };
  }

  function loadLocalCache() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? normalizeState(JSON.parse(raw)) : emptyState();
    } catch (e) { return emptyState(); }
  }
  function cacheLocal() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  // ---------- github gist sync ----------
  function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; } }
  function setToken(t) { try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
  function getCachedGistId() { try { return localStorage.getItem(GIST_ID_KEY) || ""; } catch (e) { return ""; } }
  function setCachedGistId(id) { try { if (id) localStorage.setItem(GIST_ID_KEY, id); else localStorage.removeItem(GIST_ID_KEY); } catch (e) {} }
  function ghHeaders() { return { "Authorization": "token " + getToken(), "Accept": "application/vnd.github+json" }; }

  function setSyncStatus(mode) {
    syncMode = mode;
    var pill = document.getElementById("syncPill");
    pill.classList.remove("ok", "err");
    if (mode === "synced") { pill.textContent = "Synced across your devices"; pill.classList.add("ok"); }
    else if (mode === "syncing") { pill.textContent = "Saving…"; pill.classList.add("ok"); }
    else if (mode === "local") { pill.textContent = "Local only — tap to set up sync"; pill.classList.add("err"); }
    else if (mode === "badtoken") { pill.textContent = "Sync key not working — tap to fix"; pill.classList.add("err"); }
    else if (mode === "error") { pill.textContent = "Not synced — tap to retry"; pill.classList.add("err"); }
    else { pill.textContent = "Checking sync…"; }
  }

  function findOrCreateGist() {
    var cached = getCachedGistId();
    if (cached) {
      return fetch(GITHUB_API + "/gists/" + cached, { headers: ghHeaders() }).then(function (res) {
        if (res.status === 401) return Promise.reject({ code: "bad_token" });
        if (res.ok) return cached;
        return searchOrCreateGist();
      });
    }
    return searchOrCreateGist();
  }
  function searchOrCreateGist() {
    return fetch(GITHUB_API + "/gists?per_page=100", { headers: ghHeaders() }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      return res.json();
    }).then(function (list) {
      var found = list.find(function (g) { return g.files && g.files[GIST_FILENAME]; });
      if (found) { setCachedGistId(found.id); return found.id; }
      var body = { description: "Time Tracker data", public: false, files: {} };
      body.files[GIST_FILENAME] = { content: JSON.stringify(emptyState()) };
      return fetch(GITHUB_API + "/gists", { method: "POST", headers: ghHeaders(), body: JSON.stringify(body) })
        .then(function (res) {
          if (res.status === 401) return Promise.reject({ code: "bad_token" });
          if (!res.ok) return Promise.reject({ code: "http_error" });
          return res.json();
        })
        .then(function (g) { setCachedGistId(g.id); return g.id; });
    });
  }

  function queueMutation(mutateFn) {
    state = mutateFn(state);
    state = normalizeState(state);
    cacheLocal();
    render();
    if (!getToken()) return;
    pendingSync = true;
    setSyncStatus("syncing");
    clearTimeout(flushTimer);
    flushTimer = setTimeout(flushToRemote, 800);
  }

  function flushToRemote() {
    if (!getToken() || !pendingSync) return;
    pendingSync = false;
    findOrCreateGist().then(function (gistId) {
      var body = { files: {} };
      body.files[GIST_FILENAME] = { content: JSON.stringify(state) };
      return fetch(GITHUB_API + "/gists/" + gistId, { method: "PATCH", headers: ghHeaders(), body: JSON.stringify(body) });
    }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      setSyncStatus("synced");
    }).catch(function (err) {
      pendingSync = true;
      setSyncStatus(err && err.code === "bad_token" ? "badtoken" : "error");
    });
  }

  function initSync() {
    state = loadLocalCache();
    render();
    if (!getToken()) { setSyncStatus("local"); return Promise.resolve(); }
    setSyncStatus("syncing");
    return findOrCreateGist().then(function (gistId) {
      return fetch(GITHUB_API + "/gists/" + gistId, { headers: ghHeaders() });
    }).then(function (res) {
      if (res.status === 401) return Promise.reject({ code: "bad_token" });
      if (!res.ok) return Promise.reject({ code: "http_error" });
      return res.json();
    }).then(function (gist) {
      var file = gist.files && gist.files[GIST_FILENAME];
      var remote = file && file.content ? JSON.parse(file.content) : null;
      state = normalizeState(remote);
      cacheLocal();
      render();
      setSyncStatus("synced");
    }).catch(function (err) {
      setSyncStatus(err && err.code === "bad_token" ? "badtoken" : "error");
    });
  }

  // ---------- derived: entries with end times ----------
  // Two lanes: the main sequential chain (end = next main entry's start, unless a
  // manual end is set), and free-floating "alongside" entries that carry their own
  // explicit start + end and never touch the chain.
  function rowsForDay(dayK) {
    var all = state.entries.slice().sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
    var mainSeq = all.filter(function (e) { return !e.concurrent; }); // includes stop markers
    var rows = [];

    for (var i = 0; i < mainSeq.length; i++) {
      var e = mainSeq[i];
      if (dateKey(new Date(e.startAt)) !== dayK) continue;
      var next = mainSeq[i + 1];
      var autoEndAt = next ? next.startAt : null;
      var endAt = e.endAt || autoEndAt; // a manual end wins over the next entry's start
      rows.push({
        entry: e, lane: "main", endAt: endAt, autoEndAt: autoEndAt,
        hasManualEnd: !!e.endAt, isLast: !next,
        ongoing: !next && !e.endAt
      });
    }

    all.filter(function (e) { return e.concurrent; }).forEach(function (e) {
      if (dateKey(new Date(e.startAt)) !== dayK) return;
      rows.push({
        entry: e, lane: "alongside", endAt: e.endAt || null, autoEndAt: null,
        hasManualEnd: !!e.endAt, isLast: false,
        ongoing: !e.endAt
      });
    });

    rows.sort(function (a, b) { return new Date(a.entry.startAt) - new Date(b.entry.startAt); });
    return rows;
  }

  // ---------- routing ----------
  // "#day[/DATE]" full day · "#overview[/DATE]" day breakdown · "#goals" · else home
  function applyRoute() {
    var h = (location.hash || "").replace(/^#\/?/, "");
    function datedFrom(prefix) {
      var p = h.slice(prefix.length).replace(/^\//, "");
      return /^\d{4}-\d{2}-\d{2}$/.test(p) ? p : todayKey();
    }
    if (h === "goals") {
      route = "goals"; goalsView = "categories";
    } else if (h === "tasks") {
      route = "goals"; goalsView = "tasks";
    } else if (h === "overview" || h.indexOf("overview/") === 0) {
      route = "overview";
      viewDate = datedFrom("overview");
    } else if (h === "day" || h.indexOf("day/") === 0) {
      route = "day";
      viewDate = datedFrom("day");
    } else {
      route = "home";
      viewDate = todayKey();
    }
    var isHome = route === "home", isGoals = route === "goals", isOverview = route === "overview";
    var dated = route === "day" || isOverview;
    document.getElementById("backHome").hidden = isHome;
    document.getElementById("daynav").hidden = !dated;
    document.getElementById("homeHead").hidden = !isHome;
    document.getElementById("addPanel").hidden = !isHome;
    document.getElementById("goalsPage").hidden = !isGoals;
    document.getElementById("overviewPage").hidden = !isOverview;
    document.getElementById("timeline").hidden = isGoals || isOverview;
    document.getElementById("summary").hidden = isGoals || isOverview;
    document.getElementById("showMore").hidden = !isHome;
    window.scrollTo(0, 0);
    render();
  }
  function goToDay(dayK) { location.hash = "#day/" + dayK; }
  function goToOverview(dayK) { location.hash = "#overview/" + (dayK || todayKey()); }
  function goToGoals() { location.hash = "#goals"; }
  function goToTasks() { location.hash = "#tasks"; }
  function goDated(dayK) { (route === "overview" ? goToOverview : goToDay)(dayK); }
  function goHome() {
    if (location.hash) location.hash = "";
    else applyRoute();
  }

  // ---------- render ----------
  function render() {
    if (route === "goals") { renderGoals(); return; }
    if (route === "overview") { renderHeads(); renderOverview(); return; }
    if (route === "home") viewDate = todayKey();
    renderHeads();
    renderSummary();
    renderTimeline();
  }

  function renderHeads() {
    var rel = relLabel(viewDate);
    var nice = keyToDate(viewDate).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    var label = escapeHtml(nice) + (rel ? ' <span class="rel">' + escapeHtml(rel) + "</span>" : "");
    document.getElementById("dateLabel").innerHTML = label;
    document.getElementById("homeDateLabel").innerHTML = label;
    document.getElementById("datePicker").value = viewDate;
    document.getElementById("pageTitle").textContent =
      route === "day" ? nice : route === "overview" ? "Overview" : "Time Tracker";
  }

  function goalKind(c) { return state.goalKinds[c] === "limit" ? "limit" : "invest"; }
  function taskKey(cat, task) { return (cat || "—") + "\n" + task; }

  // duration per entry id across all days (same chain rules as rowsForDay)
  function entryDurations() {
    var out = {};
    var all = state.entries.slice().sort(function (a, b) { return new Date(a.startAt) - new Date(b.startAt); });
    var main = all.filter(function (e) { return !e.concurrent; }); // keeps stop markers as boundaries
    for (var i = 0; i < main.length; i++) {
      var e = main[i];
      if (e.stop) continue;
      var next = main[i + 1];
      var s = new Date(e.startAt).getTime();
      var end = e.endAt ? new Date(e.endAt).getTime() : (next ? new Date(next.startAt).getTime() : null);
      out[e.id] = end == null ? 0 : Math.max(0, end - s);
    }
    all.forEach(function (e) {
      if (e.concurrent && !e.stop) {
        var s2 = new Date(e.startAt).getTime();
        out[e.id] = e.endAt ? Math.max(0, new Date(e.endAt).getTime() - s2) : 0;
      }
    });
    return out;
  }

  function renderGoals() {
    document.getElementById("pageTitle").textContent = "Daily goals";
    var list = document.getElementById("goalsList");
    list.innerHTML =
      '<div class="goals-tabs">' +
        '<button type="button" class="goals-tab' + (goalsView === "categories" ? " active" : "") + '" data-view="categories">Categories</button>' +
        '<button type="button" class="goals-tab' + (goalsView === "tasks" ? " active" : "") + '" data-view="tasks">Tasks</button>' +
      "</div>" +
      (goalsView === "tasks" ? taskGoalsHtml() : categoryGoalsHtml());
  }

  function categoryGoalsHtml() {
    var cats = state.categories.slice().sort(function (a, b) { return a.localeCompare(b); });
    if (!cats.length) return '<p class="goals-empty">No categories yet — log a few entries first, then set a goal for each.</p>';

    function goalRow(c) {
      var g = state.goals[c] || 0, k = goalKind(c);
      return '<div class="goal-row" data-cat="' + escapeHtml(c) + '" draggable="true">' +
        '<button type="button" class="goal-move" data-act="move" title="Move to the other section">' +
          (k === "invest" ? "↓" : "↑") + "</button>" +
        '<span class="goal-cat"><span class="dot" style="background:' + catColor(c) + '"></span>' +
          '<span class="goal-cat-name">' + escapeHtml(c) + "</span></span>" +
        '<input type="text" class="goal-input ' + k + '" inputmode="text" autocomplete="off" placeholder="none" value="' +
          (g ? escapeHtml(fmtMins(g)) : "") + '">' +
      "</div>";
    }
    function section(kind, label, sub, rows) {
      return '<div class="goal-section ' + kind + '" data-kind="' + kind + '">' +
        '<div class="goal-section-label">' + label + "</div>" +
        '<div class="goal-section-sub">' + sub + "</div>" +
        (rows.length ? rows.map(goalRow).join("") : '<div class="goal-section-hint">Drag a category here, or use the ↕ button.</div>') +
      "</div>";
    }
    var invest = cats.filter(function (c) { return goalKind(c) === "invest"; });
    var limit = cats.filter(function (c) { return goalKind(c) === "limit"; });
    return '<p class="goals-intro">Target time per category, per day — e.g. <code>1h 30m</code>, <code>45m</code>, <code>1:30</code>.</p>' +
      section("invest", "↑ Spend more", "Goals to reach — the closer you get, the better.", invest) +
      '<div class="goal-divider">drag across the line</div>' +
      section("limit", "↓ Spend less", "Caps to stay under — less time here is a win.", limit);
  }

  function taskGoalsHtml() {
    var dur = entryDurations();
    var byCat = {};
    state.entries.forEach(function (e) {
      if (e.stop || !e.task) return;

  // ---------- overview page ----------
  function renderOverview() {
    var box = document.getElementById("overviewBody");
    var now = Date.now();
    var isToday = viewDate === todayKey();
    var rows = rowsForDay(viewDate).filter(function (r) { return !r.entry.stop; });

    function durMs(r) {
      var s = new Date(r.entry.startAt).getTime();
      var e = r.endAt ? new Date(r.endAt).getTime() : (r.ongoing && isToday ? now : null);
      return e == null ? 0 : Math.max(0, e - s);
    }
    var wallMs = 0, alongMs = 0, byCat = {};
    rows.forEach(function (r) {
      var d = durMs(r);
      if (r.lane === "main") wallMs += d; else alongMs += d;
      var c = r.entry.category || "—";
      byCat[c] = (byCat[c] || 0) + d;
    });

    var items = state.categories.map(function (c) {
      return { cat: c, spent: Math.round((byCat[c] || 0) / 60000), goal: state.goals[c] || 0, kind: goalKind(c) };
    }).filter(function (x) { return x.spent > 0 || x.goal > 0; });
    if (byCat["—"]) {
      items.push({ cat: "—", spent: Math.round(byCat["—"] / 60000), goal: 0, kind: "invest", uncat: true });
    }
    items.sort(function (a, b) { return b.spent - a.spent; });

    if (!items.length) {
      box.innerHTML = '<p class="ov-empty">Nothing logged yet for this day.</p>';
      return;
    }

    var scale = Math.max.apply(null, [1].concat(items.map(function (x) { return Math.max(x.spent, x.goal); })));
    var top = items[0];
    var investG = items.filter(function (x) { return !x.uncat && x.kind === "invest" && x.goal > 0; });
    var limitG = items.filter(function (x) { return !x.uncat && x.kind === "limit" && x.goal > 0; });
    var investMet = investG.filter(function (x) { return x.spent >= x.goal; }).length;
    var limitKept = limitG.filter(function (x) { return x.spent <= x.goal; }).length;

    var gist = '<div class="ov-gist">' +
      "You’ve tracked <b>" + fmtMins(Math.round(wallMs / 60000)) + "</b>" +
      (alongMs >= 60000 ? ", plus " + fmtMins(Math.round(alongMs / 60000)) + " alongside," : "") +
      (isToday ? " so far today." : " on this day.") +
      '<div class="ov-gist-line">Most time on <b>' + escapeHtml(top.cat) + "</b> · " + fmtMins(top.spent) + ".</div>" +
      (investG.length || limitG.length
        ? '<div class="ov-gist-line">' +
          (investG.length ? "Reached <b>" + investMet + "/" + investG.length + "</b> time goals" : "") +
          (investG.length && limitG.length ? " · " : "") +
          (limitG.length ? "under <b>" + limitKept + "/" + limitG.length + "</b> limits" : "") +
          ".</div>"
        : "") +
      "</div>";

    var list = items.map(function (x) {
      var barColor = x.uncat ? "var(--ink-faint)" : catColor(x.cat);
      var pctSpent = Math.max(x.spent > 0 ? 3 : 0, Math.min(100, x.spent / scale * 100));
      var tick = x.goal ? '<span class="ov-goal-tick" style="left:' + Math.min(100, x.goal / scale * 100) + '%"></span>' : "";
      var nums = fmtMins(x.spent) +
        (x.goal ? ' <span style="opacity:.55">/ ' + fmtMins(x.goal) + (x.kind === "limit" ? " cap" : "") + "</span>" : "");
      var status = "", scls = "";
      if (x.uncat) { status = "uncategorised"; }
      else if (x.kind === "invest") {
        if (!x.goal) status = "no goal set";
        else if (x.spent >= x.goal) { status = "goal met"; scls = "good"; }
        else status = Math.round(x.spent / x.goal * 100) + "% · " + fmtMins(x.goal - x.spent) + " to go";
      } else {
        if (!x.goal) status = "no limit set";
        else if (x.spent < x.goal) { status = fmtMins(x.goal - x.spent) + " left under limit"; scls = "good"; }
        else if (x.spent === x.goal) { status = "right at the limit"; scls = "good"; }
        else { status = "over by " + fmtMins(x.spent - x.goal); scls = "bad"; }
      }
      var kindBadge = x.uncat ? "" :
        '<span class="ov-kind ' + x.kind + '">' + (x.kind === "invest" ? "↑ more" : "↓ less") + "</span>";
      return '<div class="ov-row">' +
        '<div class="ov-row-head">' +
          '<span class="ov-row-name"><span class="dot" style="background:' + barColor + '"></span>' + escapeHtml(x.cat) + "</span>" +
          '<span class="ov-row-nums">' + nums + "</span>" +
        "</div>" +
        '<div class="ov-track"><span class="ov-fill" style="width:' + pctSpent + "%;background:" + barColor + '"></span>' + tick + "</div>" +
        '<div class="ov-status"><span class="' + scls + '">' + status + "</span>" + kindBadge + "</div>" +
      "</div>";
    }).join("");

    box.innerHTML = gist + '<div class="ov-section-label">Where your time went</div>' + list;
  }

  // ---------- day export (CSV + a report to paste into ChatGPT) ----------

      .map(function (r) {
        var startMs = new Date(r.entry.startAt).getTime();
        var endMs = r.endAt ? new Date(r.endAt).getTime() : (r.ongoing && isToday ? now : null);
        if (endMs != null && endMs < startMs) endMs = null; // guard against a future-dated start
        return {
          start: fmtClock(r.entry.startAt),
          end: endMs == null ? "" : pad(new Date(endMs).getHours()) + ":" + pad(new Date(endMs).getMinutes()),
          mins: endMs == null ? "" : Math.max(0, Math.round((endMs - startMs) / 60000)),
          category: r.entry.category || "",

    var items = state.categories.map(function (c) {

  function copyText(text, btn) {
    var restore = btn.textContent;
    function done(msg) { btn.textContent = msg; setTimeout(function () { btn.textContent = restore; }, 1600); }
    function legacy() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      done(ok ? "Copied ✓" : "Copy failed");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done("Copied ✓"); }, legacy);
    } else legacy();
  }
  function downloadFile(name, text, mime) {
    var blob = new Blob([text], { type: mime + ";charset=utf-8" });

    a.href = url; a.download = name;

  function renderSummary() {
    var box = document.getElementById("summary");
    var allRows = rowsForDay(viewDate).filter(function (r) { return !r.entry.stop; });
    if (!allRows.length) { box.hidden = true; box.innerHTML = ""; return; }
    var now = Date.now();
    var isToday = viewDate === todayKey();

    // roll one lane's rows up into { total, byCat } — Option A keeps the lanes apart
    function tally(rows) {
      var byCat = {}, total = 0, count = 0;
      rows.forEach(function (r) {
        var start = new Date(r.entry.startAt).getTime();
        var end = r.endAt ? new Date(r.endAt).getTime() : (r.ongoing && isToday ? now : null);
        if (end == null) { count++; return; }
        var dur = Math.max(0, end - start);
        total += dur; count++;
        var c = r.entry.category || "—";
        byCat[c] = (byCat[c] || 0) + dur;
      });
      return { byCat: byCat, total: total, count: count };
    }
    function catChips(byCat) {
      return Object.keys(byCat).sort(function (a, b) { return byCat[b] - byCat[a]; }).map(function (c) {
        return '<span class="lg"><span class="dot" style="background:' + catColor(c) + '"></span>' +
          escapeHtml(c) + " · " + fmtDuration(byCat[c]) + "</span>";
      }).join("");
    }

    var main = tally(allRows.filter(function (r) { return r.lane === "main"; }));
    var along = tally(allRows.filter(function (r) { return r.lane === "alongside"; }));

    var mainCats = Object.keys(main.byCat).sort(function (a, b) { return main.byCat[b] - main.byCat[a]; });
    var bar = mainCats.map(function (c) {
      var pct = main.total ? (main.byCat[c] / main.total * 100) : 0;
      return '<span style="width:' + pct.toFixed(2) + '%;background:' + catColor(c) + '"></span>';
    }).join("");

    var html =
      '<div class="summary-total">Tracked <b>' + fmtDuration(main.total) + "</b> across " + main.count +
      " " + (main.count === 1 ? "entry" : "entries") + "</div>" +

  // ---------- mutations ----------
  function addEntry(hhmm, task, category, opts) {
    opts = opts || {};
    var startAt = makeStartAt(viewDate, hhmm);
    var endAt = opts.concurrent ? makeEndAt(startAt, opts.endHHMM || "") : "";
    category = category.trim();
    queueMutation(function (s) {
      s.entries.push({
        id: uid(), startAt: startAt, endAt: endAt,
        concurrent: !!opts.concurrent,
        task: task.trim(), category: category, stop: false,
        createdAt: new Date().toISOString()
      });
      if (category && s.categories.indexOf(category) < 0) s.categories.push(category);
      return s;
    });
  }
  function addStop(hhmm) {
    var startAt = makeStartAt(viewDate, hhmm);
    queueMutation(function (s) {
      s.entries.push({ id: uid(), startAt: startAt, task: "", category: "", stop: true, createdAt: new Date().toISOString() });
      return s;
    });
  }
  function updateEntry(id, patch) {
    queueMutation(function (s) {
      s.entries = s.entries.map(function (e) {
        if (e.id !== id) return e;
        var next = Object.assign({}, e);
        if (patch.time) next.startAt = makeStartAt(dateKey(new Date(e.startAt)), patch.time);
        if ("end" in patch) next.endAt = makeEndAt(next.startAt, patch.end || "");
        if ("concurrent" in patch) next.concurrent = !!patch.concurrent;
        if ("task" in patch) next.task = patch.task.trim();
        if ("category" in patch) next.category = patch.category.trim();
        return next;
      });
      return s;
    });
  }
  function deleteEntry(id) {
    queueMutation(function (s) {
      s.entries = s.entries.filter(function (e) { return e.id !== id; });
      return s;
    });
  }
  function endEntryNow(id) {
    var iso = new Date().toISOString();
    queueMutation(function (s) {
      s.entries = s.entries.map(function (e) {
        return e.id === id ? Object.assign({}, e, { endAt: iso }) : e;
      });
      return s;
    });
  }
  function setGoal(category, mins) {
    queueMutation(function (s) {
      s.goals = Object.assign({}, s.goals);
      if (mins > 0) s.goals[category] = mins; else delete s.goals[category];
      return s;
    });
  }
  function setGoalKind(category, kind) {
    queueMutation(function (s) {
      s.goalKinds = Object.assign({}, s.goalKinds);
      if (kind === "limit") s.goalKinds[category] = "limit"; else delete s.goalKinds[category];
      return s;
    });
  }
  function setTaskGoal(category, task, mins) {
    var k = taskKey(category, task);
    queueMutation(function (s) {
      s.taskGoals = Object.assign({}, s.taskGoals);
      if (mins > 0) s.taskGoals[k] = mins; else delete s.taskGoals[k];
      return s;
    });
  }

  // ---------- add form ----------
  var fTime = document.getElementById("f-time");
  var fTask = document.getElementById("f-task");
  var fCat = document.getElementById("f-category");

  var agoBtn = document.getElementById("agoBtn");
  var agoN = 0; // 0 = not stepped back yet; cycles 1 → 2 → 3 → 1
  function resetAgo() { agoN = 0; agoBtn.textContent = "1 min ago"; }
  document.getElementById("nowBtn").addEventListener("click", function () { fTime.value = nowHHMM(); resetAgo(); });
  agoBtn.addEventListener("click", function () {
    agoN = (agoN % 3) + 1;
    fTime.value = hhmmMinsAgo(agoN);
    agoBtn.textContent = agoN + " min ago";
  });

  attachTimeInput(fTime);
  // focusing the new-entry time field clears it so you can type fresh 4 digits
  // (the inline edit field keeps its value)
  fTime.addEventListener("focus", function () { fTime.value = ""; });
  // once a full 4-digit time is in, jump to the task field automatically
  fTime.addEventListener("input", function () {
    var digits = fTime.value.replace(/\D/g, "");
    if (digits.length === 4) {
      var t = normTime(digits);
      if (t) { fTime.value = t; fTask.focus(); }
    }
  });

  var fConcurrent = document.getElementById("f-concurrent");
  var fEnd = document.getElementById("f-end");
  var fEndField = document.getElementById("f-end-field");
  var logBtn = document.getElementById("logBtn");
  attachTimeInput(fEnd);
  fConcurrent.addEventListener("change", function () {
    fEndField.hidden = !fConcurrent.checked;
    logBtn.textContent = fConcurrent.checked ? "Log alongside" : "Log entry";
  });

  document.getElementById("addForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var t = fTime.value.trim() ? normTime(fTime.value) : nowHHMM();
    if (!t) { fTime.value = ""; fTime.focus(); return; }
    fTime.value = t;
    if (!fTask.value.trim()) { fTask.focus(); return; }
    var concurrent = fConcurrent.checked;
    var endHHMM = "";
    if (concurrent && fEnd.value.trim()) {
      endHHMM = normTime(fEnd.value);
      if (!endHHMM) { fEnd.focus(); return; }
    }
    addEntry(t, fTask.value, fCat.value, { concurrent: concurrent, endHHMM: endHHMM });
    fTask.value = "";
    fEnd.value = "";
    fConcurrent.checked = false;
    fEndField.hidden = true;
    logBtn.textContent = "Log entry";
    fTime.value = nowHHMM();
    resetAgo();
    hideAc();
    fTask.focus();
  });

  document.getElementById("stopBtn").addEventListener("click", function () {
    addStop(normTime(fTime.value) || nowHHMM());
  });

  // category autocomplete
  var acList = document.getElementById("categoryAc");
  var acActive = -1;
  function acMatches() {
    var q = fCat.value.trim().toLowerCase();
    var counts = {};
    state.entries.forEach(function (e) { if (e.category) counts[e.category] = (counts[e.category] || 0) + 1; });
    return state.categories
      .filter(function (c) { return !q || c.toLowerCase().indexOf(q) >= 0; })
      .sort(function (a, b) { return (counts[b] || 0) - (counts[a] || 0) || a.localeCompare(b); })
      .slice(0, 8)
      .map(function (c) { return { name: c, count: counts[c] || 0 }; });
  }
  function showAc() {
    var m = acMatches();
    if (!m.length) { hideAc(); return; }
    acActive = -1;
    acList.innerHTML = m.map(function (x, i) {
      return '<div class="ac-item" data-i="' + i + '" data-name="' + escapeHtml(x.name) + '">' +
        escapeHtml(x.name) + (x.count ? '<span class="cnt">' + x.count + "×</span>" : "") + "</div>";
    }).join("");
    acList.hidden = false;
    fCat.setAttribute("aria-expanded", "true");
  }
  function hideAc() { acList.hidden = true; acActive = -1; fCat.setAttribute("aria-expanded", "false"); }
  // clicking into the category field clears whatever's there (it stays filled after
  // a log as a sticky default) so a fresh pick / type is quick
  fCat.addEventListener("focus", function () { fCat.value = ""; });
  fCat.addEventListener("focus", showAc);
  fCat.addEventListener("input", showAc);
  fCat.addEventListener("blur", function () { setTimeout(hideAc, 120); });
  fCat.addEventListener("keydown", function (ev) {
    if (acList.hidden) return;
    var items = acList.querySelectorAll(".ac-item");
    if (ev.key === "ArrowDown") { ev.preventDefault(); acActive = Math.min(acActive + 1, items.length - 1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); acActive = Math.max(acActive - 1, 0); }
    else if (ev.key === "Enter" && acActive >= 0) { ev.preventDefault(); fCat.value = items[acActive].dataset.name; hideAc(); return; }
    else if (ev.key === "Escape") { hideAc(); return; }
    else return;
    items.forEach(function (el, i) { el.classList.toggle("active", i === acActive); });
  });
  acList.addEventListener("mousedown", function (ev) {
    var item = ev.target.closest(".ac-item");
    if (!item) return;
    ev.preventDefault();
    fCat.value = item.dataset.name;
    hideAc();
  });

  // ---------- timeline interactions ----------
  document.getElementById("timeline").addEventListener("click", function (ev) {
    var stopLi = ev.target.closest(".stopmark");
    if (stopLi && ev.target.dataset.act === "del-stop") { deleteEntry(stopLi.dataset.id); return; }

    var li = ev.target.closest(".entry");
    if (!li) return;
    var id = li.dataset.id;
    var editBox = li.querySelector(".entry-edit");
    var act = ev.target.dataset.act;

    if (ev.target.closest(".entry-head") && !act) {
      var willOpen = editBox.hidden;
      document.querySelectorAll(".entry-edit").forEach(function (b) { b.hidden = true; });
      editBox.hidden = !willOpen;
      if (willOpen) {
        attachTimeInput(editBox.querySelector('[data-f="time"]'));
        var endEl = editBox.querySelector('[data-f="end"]');
        attachTimeInput(endEl);
        // an ongoing alongside entry: default its end to "now" so a quick Save
        // just closes it; first tap on the field wipes it for a different time
        if (endEl.dataset.prefillNow === "1" && !endEl.value) {
          endEl.value = nowHHMM();
          endEl.addEventListener("focus", function clr() {
            endEl.value = "";
            endEl.removeEventListener("focus", clr);
          });
        }
      }
      return;
    }
    if (act === "cancel") { editBox.hidden = true; render(); return; }
    if (act === "delete") { if (confirm("Delete this entry?")) deleteEntry(id); return; }
    if (act === "end-now") { endEntryNow(id); return; }
    if (act === "save") {
      var timeEl = editBox.querySelector('[data-f="time"]');
      var t = normTime(timeEl.value);
      if (!t) { timeEl.focus(); return; }
      var endEl = editBox.querySelector('[data-f="end"]');
      var endRaw = endEl.value.trim();
      var endNorm = endRaw ? normTime(endRaw) : "";
      if (endRaw && !endNorm) { endEl.focus(); return; }
      updateEntry(id, {
        time: t,
        end: endNorm,
        concurrent: editBox.querySelector('[data-f="concurrent"]').checked,
        task: editBox.querySelector('[data-f="task"]').value,
        category: editBox.querySelector('[data-f="category"]').value
      });
    }
  });

  // ---------- navigation ----------
  function shiftDay(delta) {
    var d = keyToDate(viewDate);
    d.setDate(d.getDate() + delta);
    goDated(dateKey(d));
  }
  document.getElementById("prevDay").addEventListener("click", function () { shiftDay(-1); });
  document.getElementById("nextDay").addEventListener("click", function () { shiftDay(1); });
  document.getElementById("datePicker").addEventListener("change", function (ev) {
    if (ev.target.value) goDated(ev.target.value);
  });
  document.getElementById("showMore").addEventListener("click", function () { goToDay(viewDate); });
  document.getElementById("backHome").addEventListener("click", goHome);
  document.getElementById("toGoals").addEventListener("click", goToGoals);
  document.getElementById("toTasks").addEventListener("click", goToTasks);
  document.getElementById("toOverview").addEventListener("click", function () { goToOverview(); });
  window.addEventListener("hashchange", applyRoute);

  document.getElementById("ovCopy").addEventListener("click", function () {
    copyText(buildReport(viewDate), this);
  });
  document.getElementById("ovCsv").addEventListener("click", function () {
    downloadFile("time-tracker-" + viewDate + ".csv", buildCsv(viewDate), "text/csv");
  });

  // ---------- goals page ----------
  var goalsList = document.getElementById("goalsList");
  goalsList.addEventListener("change", function (ev) {
    var row = ev.target.closest(".goal-row");
    if (!row || ev.target.tagName !== "INPUT") return;
    var mins = parseDuration(ev.target.value);
    ev.target.value = mins ? fmtMins(mins) : "";
    if (row.dataset.task != null) setTaskGoal(row.dataset.cat, row.dataset.task, mins);
    else setGoal(row.dataset.cat, mins);
  });
  goalsList.addEventListener("click", function (ev) {
    var tab = ev.target.closest(".goals-tab");
    if (tab) { (tab.dataset.view === "tasks" ? goToTasks : goToGoals)(); return; }
    // ↕ button flips a category between "spend more" and "spend less"
    var btn = ev.target.closest('[data-act="move"]');
    if (!btn) return;
    var cat = btn.closest(".goal-row").dataset.cat;
    setGoalKind(cat, goalKind(cat) === "invest" ? "limit" : "invest");
  });
  // drag a category across the divider (desktop)
  var dragCat = null;
  goalsList.addEventListener("dragstart", function (ev) {
    var row = ev.target.closest(".goal-row");
    if (!row) return;
    dragCat = row.dataset.cat;
    ev.dataTransfer.effectAllowed = "move";
    row.classList.add("dragging");
  });
  goalsList.addEventListener("dragover", function (ev) {
    var sec = ev.target.closest(".goal-section");
    if (!sec || !dragCat) return;
    ev.preventDefault();
    sec.classList.add("drop-target");
  });
  goalsList.addEventListener("dragleave", function (ev) {
    var sec = ev.target.closest(".goal-section");
    if (sec && !sec.contains(ev.relatedTarget)) sec.classList.remove("drop-target");
  });
  goalsList.addEventListener("drop", function (ev) {
    var sec = ev.target.closest(".goal-section");
    if (!sec || !dragCat) return;
    ev.preventDefault();
    setGoalKind(dragCat, sec.dataset.kind);
    dragCat = null;
  });
  goalsList.addEventListener("dragend", function () {
    dragCat = null;
    Array.prototype.forEach.call(goalsList.querySelectorAll(".dragging, .drop-target"), function (el) {
      el.classList.remove("dragging", "drop-target");
    });
  });

  // keep the "now" ticking while an entry is still running
  setInterval(function () {
    if (viewDate !== todayKey()) return;
    if (route === "overview") { renderOverview(); return; }
    if ((route === "home" || route === "day") && document.querySelector(".t-dur .now")) {
      renderSummary(); renderTimeline();
    }
  }, 30000);

  // ---------- sync modal ----------
  var syncModal = document.getElementById("syncModal");
  var syncTokenInput = document.getElementById("syncTokenInput");
  var syncTokenStatus = document.getElementById("syncTokenStatus");
  function openSyncModal() { syncTokenInput.value = getToken(); syncTokenStatus.textContent = ""; syncModal.classList.add("open"); }
  function closeSyncModal() { syncModal.classList.remove("open"); }
  document.getElementById("syncPill").addEventListener("click", function () {
    if (syncMode === "error") { flushToRemote(); return; }
    openSyncModal();
  });
  document.getElementById("closeSyncModal").addEventListener("click", closeSyncModal);
  syncModal.addEventListener("click", function (ev) { if (ev.target === syncModal) closeSyncModal(); });
  document.getElementById("saveSyncKey").addEventListener("click", function () {
    var token = syncTokenInput.value.trim();
    if (!token) { syncTokenStatus.textContent = "Paste a token first."; syncTokenStatus.style.color = "var(--danger)"; return; }
    syncTokenStatus.textContent = "Checking…"; syncTokenStatus.style.color = "var(--ink-soft)";
    setToken(token);
    setCachedGistId("");
    initSync().then(function () {
      if (syncMode === "synced") {
        syncTokenStatus.textContent = "Connected — this device is syncing.";
        syncTokenStatus.style.color = "var(--accent)";
        setTimeout(closeSyncModal, 900);
      } else if (syncMode === "badtoken") {
        syncTokenStatus.textContent = "That key didn't work — check it has “gist” access.";
        syncTokenStatus.style.color = "var(--danger)";
      } else {
        syncTokenStatus.textContent = "GitHub rejected the request — check the key and try again.";
        syncTokenStatus.style.color = "var(--danger)";
      }
    });
  });
  document.getElementById("removeSyncKey").addEventListener("click", function () {
    setToken(""); setCachedGistId("");
    syncTokenInput.value = "";
    setSyncStatus("local");
    syncTokenStatus.textContent = "Sync key removed — this device is local only now.";
    syncTokenStatus.style.color = "var(--ink-soft)";
  });

  // ---------- backup modal ----------
  var backupModal = document.getElementById("backupModal");
  var backupText = document.getElementById("backupText");
  var backupStatus = document.getElementById("backupStatus");
  document.getElementById("backupBtn").addEventListener("click", function () {
    backupText.value = JSON.stringify(state, null, 2);
    backupStatus.textContent = "";
    document.getElementById("backupNote").textContent = getToken()
      ? "Your entries sync automatically through your GitHub sync key. This panel is a manual copy for an extra backup."
      : "Sync isn't set up on this device, so entries are saved only in this browser. Copy this somewhere safe, or paste a backup back in to restore.";
    backupModal.classList.add("open");
  });
  document.getElementById("closeBackup").addEventListener("click", function () { backupModal.classList.remove("open"); });
  backupModal.addEventListener("click", function (ev) { if (ev.target === backupModal) backupModal.classList.remove("open"); });
  document.getElementById("copyBackup").addEventListener("click", function () {
    backupText.select();
    try { document.execCommand("copy"); backupStatus.textContent = "Copied."; backupStatus.style.color = "var(--accent)"; }
    catch (e) { backupStatus.textContent = "Press ⌘/Ctrl+C to copy."; }
  });
  document.getElementById("restoreBackup").addEventListener("click", function () {
    var parsed;
    try { parsed = JSON.parse(backupText.value); }
    catch (e) { backupStatus.textContent = "That isn't valid JSON."; backupStatus.style.color = "var(--danger)"; return; }
    if (!confirm("Replace all current entries with this backup?")) return;
    queueMutation(function () { return normalizeState(parsed); });
    backupStatus.textContent = "Restored.";
    backupStatus.style.color = "var(--accent)";
    setTimeout(function () { backupModal.classList.remove("open"); }, 700);
  });

  // ---------- init ----------
  fTime.value = nowHHMM();
  applyRoute();
  initSync();
})();
</script>
</body>
</html>
